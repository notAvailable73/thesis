# Phase 2 (Step 4) — evidential softplus_kl0.5 on real CIFAR-FS Bertinetto
# split, episodic meta-training with prototype head.
#
# Story: the Step 1-3 R1 trade-off (accuracy parity + AUROC win,
# calibration framed as an intentional under-confidence trade) should
# carry over from the CIFAR-100-test stand-in to the proper 64/16/20
# split. If the AUROC gap > 0.05 holds on the real split, Phase 2 closes
# and we move to Phase 3.
extends: base.yaml

trainer:
  type: episodic
  num_epochs: 30
  episodes_per_epoch: 100
  val_episodes_per_epoch: 100
  early_stop_patience: 5
  collapse_threshold: 0.25
  train_seed_offset: 20000

dataset:
  # Step 4: switch from `class_ids: [0..19]` to Bertinetto split routing.
  # Removing class_ids forces the loader to read data/cifar_fs_split.json.
  class_ids: null
  split: test       # The script reads cfg.dataset.split for the TEST evaluator;
                    # the trainer overrides to "train" / "val" internally.
  n_way: 5
  k_shot: 5
  q_query: 15

head:
  type: prototype
  # Step 4 collapse fix: cosine (scale-invariant) instead of raw L2.
  # Raw-L2 logits are O(-50) for ResNet-18 features -> softplus -> ~0
  # evidence everywhere -> uniform Dirichlet -> random acc + dead
  # gradients. Cosine logits are bounded; the learnable evidence affine
  # (scale+bias) then recentres them so the Dirichlet is sharp.
  metric: cosine
  cosine_scale: 10.0
  interpretation: evidential
  # Learnable evidence affine: evidence = softplus(scale*logit + bias).
  # Init keeps the softplus "knee" at cosine ~= 0.6 (-bias/scale = 24/4 = 6,
  # logit = 10*0.6) so evidence switches ON for in-class similarities and
  # stays ~0 for OOD -- this preserves the absolute-similarity signal that
  # drives OOD detection (unlike per-query standardization, which erases it).
  # Sharper than the first pass (3,-18): a larger scale widens the evidence
  # gap between the correct class and the rest, raising p_best toward the
  # accuracy and cutting the under-confidence that inflated ECE. scale is the
  # calibration knob (higher = more confident); if a Colab run shows ECE still
  # high, raise it; if OOD AUROC drops, lower it. Both scale/bias are LEARNABLE
  # so the optimiser fine-tunes from here. Accuracy is unchanged either way
  # (softplus is monotonic -> argmax is invariant to scale/bias).
  evidence_affine: true
  evidence_scale_init: 4.0
  evidence_bias_init: -24.0

loss:
  # Number of OUTER steps to anneal over. With episodes_per_epoch=100,
  # this is ~10 epochs of ramp.
  kl_weight_max: 0.5
  kl_anneal_steps: 1000

adapter:
  type: bottleneck
  rank: 16

train:
  lr: 5.0e-3
  weight_decay: 0.0

wandb:
  project: bpeft-thesis
  tags: [phase2, step4, evidential, prototype, cifar_fs_bertinetto]

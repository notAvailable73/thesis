# form / rank / block_ids as the serial sibling, so the head-to-head isolates
# serial-vs-parallel composition. Conv-Adapter (Chen 2022) predicts parallel >
# serial for classification — Step 6 tests whether that holds in our few-shot
# frozen-backbone prototype-head setting. See step_writeups/step6.txt.
extends: exp_phase2_evidential_retuned.yaml

adapter:
  type: bottleneck
  rank: 16
  placement: parallel
  block_ids: [0, 1, 2, 3]

